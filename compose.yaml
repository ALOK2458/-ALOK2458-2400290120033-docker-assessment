services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in .env}
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - backend-database

  backend:
    image: ${IMAGE_NAME:?Set IMAGE_NAME in .env}:${APP_VERSION:-1.0.0}
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env}
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      REGNO: ${REGNO:?Set REGNO in .env}
      APP_VERSION: ${APP_VERSION:-1.0.0}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend-backend
      - backend-database

  frontend:
    image: nginx:1.30-alpine
    ports:
      - "${PORT:?Set PORT in .env}:80"
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - frontend-backend

volumes:
  postgres_data:
    name: festpass-postgres-data

networks:
  frontend-backend:
    driver: bridge
  backend-database:
    driver: bridge
    internal: true
