<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10172a">
  <title>FestPass 2026 registrations</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #172033;
      background: #f2f5fb;
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    header {
      padding: 2rem max(1.25rem, calc((100% - 880px) / 2));
      color: #fff;
      background: linear-gradient(120deg, #10172a, #283c70);
    }
    header h1 { margin: 0 0 .4rem; font-size: clamp(1.8rem, 5vw, 2.6rem); }
    header p { margin: 0; color: #d7e1ff; }
    main { width: min(880px, calc(100% - 2rem)); margin: 2rem auto; }
    .panel {
      margin-bottom: 1.25rem;
      padding: clamp(1rem, 4vw, 1.5rem);
      border: 1px solid #e1e7f2;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 8px 26px rgb(23 32 51 / 5%);
    }
    .panel h2 { margin: 0 0 1rem; font-size: 1.2rem; }
    #status { color: #384966; }
    #status[data-state="error"] { color: #a62232; }
    #status[data-state="success"] { color: #17613c; }
    .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: .75rem; }
    .fact { padding: .8rem; border-radius: 10px; background: #f3f6fc; }
    .fact dt { color: #63718a; font-size: .82rem; }
    .fact dd { margin: .25rem 0 0; overflow-wrap: anywhere; font-weight: 650; }
    form { display: grid; grid-template-columns: 1fr 1fr auto; gap: .75rem; }
    input, select, button { min-height: 46px; border-radius: 9px; font: inherit; }
    input, select { width: 100%; padding: .65rem .75rem; border: 1px solid #cbd4e3; background: #fff; }
    button { padding: .65rem 1rem; border: 0; color: #fff; background: #3158b8; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    #registrations { display: grid; gap: .6rem; padding: 0; list-style: none; }
    #registrations li { padding: .8rem; border: 1px solid #e8edf5; border-radius: 9px; overflow-wrap: anywhere; }
    .muted { color: #63718a; }
    @media (max-width: 620px) { form { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>FestPass 2026 registrations</h1>
    <p>Register for a college tech-fest event.</p>
  </header>
  <main>
    <section class="panel" aria-labelledby="service-title">
      <h2 id="service-title">Service status</h2>
      <p id="status" role="status" aria-live="polite">Checking the backend...</p>
      <dl class="facts">
        <div class="fact"><dt>Registration number</dt><dd id="regno">Loading</dd></div>
        <div class="fact"><dt>Backend version</dt><dd id="version">Loading</dd></div>
        <div class="fact"><dt>Backend hostname</dt><dd id="hostname">Loading</dd></div>
        <div class="fact"><dt>Database</dt><dd id="database">Checking</dd></div>
      </dl>
    </section>
    <section class="panel" aria-labelledby="register-title">
      <h2 id="register-title">Join an event</h2>
      <form id="registration-form">
        <label>
          <span class="muted">Your name</span>
          <input id="name" name="name" autocomplete="name" maxlength="120" required>
        </label>
        <label>
          <span class="muted">Event</span>
          <select id="event" name="event" required>
            <option>Hackathon</option>
            <option>Robo Race</option>
            <option>Tech Quiz</option>
          </select>
        </label>
        <button id="submit-button" type="submit">Register</button>
      </form>
    </section>
    <section class="panel" aria-labelledby="list-title">
      <h2 id="list-title">Current registrations</h2>
      <p id="list-status" class="muted" aria-live="polite">Loading registrations...</p>
      <ul id="registrations"></ul>
    </section>
  </main>
  <script>
    const status = document.getElementById("status");
    const listStatus = document.getElementById("list-status");
    const registrationList = document.getElementById("registrations");
    const form = document.getElementById("registration-form");
    const submitButton = document.getElementById("submit-button");
    const api = async (path, options) => {
      const response = await fetch(`/api/${path}`, options);
      const payload = await response.json();
      if (!response.ok) {
        throw new Error(payload.error || `Request failed (${response.status})`);
      }
      return payload;
    };

    async function refreshHealth() {
      try {
        const health = await api("health");
        document.getElementById("regno").textContent = health.regno;
        document.getElementById("version").textContent = health.version;
        document.getElementById("hostname").textContent = health.container;
        document.getElementById("database").textContent =
          health.database ? "Connected" : "Not connected";
        status.dataset.state = health.database ? "success" : "error";
        status.textContent = health.database
          ? "Backend is ready and the database is connected."
          : "Backend is reachable, but the database is not connected.";
      } catch (error) {
        status.dataset.state = "error";
        status.textContent = `Backend health check failed: ${error.message}`;
      }
    }

    async function refreshRegistrations() {
      try {
        const rows = await api("registrations");
        const items = rows.map((registration) => {
          const item = document.createElement("li");
          item.textContent = `#${registration.id} - ${registration.name} (${registration.event})`;
          return item;
        });
        registrationList.replaceChildren(...items);
        listStatus.textContent = rows.length
          ? `${rows.length} registration${rows.length === 1 ? "" : "s"}`
          : "No registrations yet.";
      } catch (error) {
        listStatus.textContent = `Could not load registrations: ${error.message}`;
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      submitButton.disabled = true;
      status.dataset.state = "";
      status.textContent = "Submitting your registration...";
      try {
        await api("registrations", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            name: document.getElementById("name").value,
            event: document.getElementById("event").value,
          }),
        });
        form.reset();
        status.dataset.state = "success";
        status.textContent = "Registration saved successfully.";
        await refreshRegistrations();
      } catch (error) {
        status.dataset.state = "error";
        status.textContent = `Registration failed: ${error.message}`;
      } finally {
        submitButton.disabled = false;
      }
    });

    refreshHealth();
    refreshRegistrations();
    window.setInterval(refreshHealth, 15000);
  </script>
</body>
</html>
